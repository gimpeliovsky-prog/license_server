stages:
  - deploy

variables:
  GIT_STRATEGY: fetch
  LICENSE_SERVER_DIR: /opt/erp/license_server
  COMPOSE_ARGS: -f docker-compose.frappe.yml
  DB_SERVICE: license_db
  API_SERVICE: license_api
  WORKER_SERVICE: license_worker
  MIGRATE_SERVICE: license_migrate
  BACKUP_DIR: /opt/erp/license_server/backups
  READINESS_PATH: /health/ready
  READINESS_RETRIES: "20"
  READINESS_DELAY_SECONDS: "3"

deploy_app:
  stage: deploy
  tags:
    - deploy_lic_server
  script:
    - echo "Deploying commit ${CI_COMMIT_SHA:-unknown} (${CI_COMMIT_SHORT_SHA:-unknown})"
    - mkdir -p "$LICENSE_SERVER_DIR"
    - rsync -a --delete --exclude '.git' --exclude '.env' --exclude 'backups/' --exclude 'nginx/certs/' --exclude 'nginx/letsencrypt/' --exclude 'nginx/www/' ./ "$LICENSE_SERVER_DIR"/
    - cd "$LICENSE_SERVER_DIR"
    - export APP_VERSION="${CI_COMMIT_SHORT_SHA:-unknown}"
    - sh ./scripts/docker_deploy.sh
